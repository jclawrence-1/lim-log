<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIM Remote Log</title>
<style>
:root {
  --bg: #F4F5F3; --card: #FFFFFF; --ink: #1F2328; --muted: #5F6670; --line: #E1E4E0;
  --brand: #2D5434; --brand-ink: #FFFFFF; --amber: #D18740; --red: #C1272D; --ok: #2E9E44;
  --bar: #8FA996; --bar-hi: #D18740; --bar-alarm: #C1272D;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121514; --card: #1B1F1D; --ink: #E8EAE8; --muted: #9AA39D; --line: #2C322F;
    --brand: #2D5434; --brand-ink: #FFFFFF; --bar: #5E7A66; --bar-hi: #E09A55; --bar-alarm: #E0484E;
  }
}
:root[data-theme="dark"] {
  --bg: #121514; --card: #1B1F1D; --ink: #E8EAE8; --muted: #9AA39D; --line: #2C322F;
  --brand: #2D5434; --brand-ink: #FFFFFF; --bar: #5E7A66; --bar-hi: #E09A55; --bar-alarm: #E0484E;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
header { background: var(--brand); color: var(--brand-ink); padding: 14px 16px 12px; }
header .k { font-size: 12px; opacity: .8; letter-spacing: .04em; text-transform: uppercase; }
header h1 { margin: 2px 0 0; font-size: 20px; }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px 32px; }
.banner { background: #FFF4E5; color: #6B4A12; border: 1px solid #F0D2A4; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner { background: #3A2E1A; color: #F0D9B0; border-color: #5A4524; } }
.err { background: #FDECEC; color: #7A1A1E; border-color: #F2B8BB; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.state { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #fff; }
.insight { margin: 12px 0; border-left: 4px solid var(--amber); }
.insight ul { margin: 6px 0 0; padding-left: 18px; }
.insight li { margin: 6px 0; }
.verdict { font-size: 17px; font-weight: 700; }
.banner a { color: inherit; }
h2 { font-size: 14px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.foot { font-size: 12px; color: var(--muted); margin-top: 16px; }
details { margin-top: 16px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.actions button { margin-top: 0; }
.actions .alt { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .actions .alt { color: #9CC7A6; border-color: #5E7A66; } }
@media print { .actions, details, #banner .banner:not(.err) { display: none; } body { background: #fff; } }
textarea { width: 100%; min-height: 70px; font: 12px monospace; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
button { margin-top: 6px; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header><div class="k" id="kind">LIM remote log</div><h1 id="title">Panel</h1></header>
<main>
  <div id="banner"></div>
  <div class="grid" id="stats"></div>
  <div class="card insight" id="insight"></div>
  <div id="stabWrap" hidden><h2>Stability</h2><div class="grid" id="stab"></div></div>
  <div id="recWrap" hidden><h2>Test record at this remote</h2><div class="card" id="rec"></div></div>
  <div id="testWrap" hidden><h2>LIM self-tests and remote</h2><div class="grid" id="tests"></div></div>
  <h2 id="c24h">Last 24 hours (hourly max)</h2>
  <div class="card" id="c24"></div>
  <h2 id="c30h">Last 30 days (daily max)</h2>
  <div class="card" id="c30"></div>
  <div id="evWrap"><h2>Alarms, last 7 days</h2>
  <div class="card" id="events"></div></div>
  <div class="foot" id="foot"></div>
  <div class="actions" id="actions" hidden>
    <button id="share">Share this log</button>
    <button id="print" class="alt">Print / save PDF</button>
  </div>
  <details><summary>Decode another link</summary>
    <textarea id="paste" placeholder="Paste the scanned link here"></textarea>
    <button id="go">Show</button>
  </details>
</main>
<script>
// Decoder for the remote log QR, formats v1 to v4 (log-qr-format.md). v4 = two reports from the remote's
// report screen: kind 1 THC trend (SILENCE), kind 2 LIM health (TEST). Everything stays on this device:
// the data is in the link's # part, which browsers never send to a server.
// SAMPLES is rewritten by make_log_qr.py; ?sample=lim picks the other one.
const SAMPLES = {"room": {"link": "https://jclawrence-1.github.io/lim-log/p/A7K3Q#4.BAEUHDI1vgQ13yAFBdEEM3IKNFEbM-4gM48mLxwcHBwXFxcYFxcYFxgSEhISHBwzNS4cHDU1HBg1NTUmJhwYJiYmJiYcGCYmJiYmHBgmJiYmJhHBd4d3dxgRwfH4EQESCDEAAKgAAwDYA3s", "scan": "2026-10-28T10:15:00", "label": "Room equipment: THC trend"}, "room-health": {"link": "https://jclawrence-1.github.io/lim-log/p/A7K3Q#4.BAIUHDKoAAcAAAAAAAAAAAAAAAAAAAAAAADjA-MDEgAYAACRkZGRkZGRkZGSkpGRkpGRkZGRkpGSkZGRkZKSkpFDBHwBAgCiAQMArgEBNlgCBAADANgDoQ", "scan": "2026-10-28T10:15:00", "label": "Room equipment: LIM health"}, "lim": {"link": "https://jclawrence-1.github.io/lim-log/p/B2M9X#4.BAEUGjIu0gQ4HQwDAx0MAsUYAvkgAigaGioWFhYWJxYWFioWFhYWKhoaLhoaGi4qOCw4OC8qLi4WGhoaGhoaFhoaGhoaGhYaGhoaGh_xERF_ER8R8REfEQEBAQEHQKg9AADoBbY", "scan": "2026-10-28T10:15:00", "label": "LIM fault (Catawba-style): THC trend"}, "lim-health": {"link": "https://jclawrence-1.github.io/lim-log/p/B2M9X#4.BAIUGjKoPQMTDNYACgkmC7oNPhEuEtITZha-GDYZJhqeGgAhQUQzVwAAAAAAAAAAAADjA60DHABYACRpaWpdXFtbXF5hh4mHh4iHiIeHh4eIh4eHh4eHiodDAADoBUM", "scan": "2026-10-28T10:15:00", "label": "LIM fault (Catawba-style): LIM health"}, "pg-health": {"link": "https://jclawrence-1.github.io/lim-log/p/C4P7R#4.BAI0HDKoAABDAwDYA1E", "scan": "2026-10-28T10:15:00", "label": "PG Mark IV (start-only): LIM health"}};
const LIM_TYPES = ['Unknown LIM', 'Square D Series D', 'IPS Sentry 5', 'PG Mark IV', 'PG Mark V / SafeDetec', 'Schneider Series 6 / Bender', 'PG Mark III (adapter)', 'MainPro adapter'];
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LINK_RE = /\/p\/([^#?\/]+)[^#]*#([1-4])\.([A-Za-z0-9_-]+)(?:\.(\d+))?/;

function decode(link) {
  const m = LINK_RE.exec(link);
  if (!m) throw new Error('Not a remote log link.');
  const b64 = m[3].replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const b = Uint8Array.from(raw, c => c.charCodeAt(0));
  let sum = 0; for (let i = 0; i < b.length - 1; i++) sum = (sum + b[i]) & 255;
  if (b[0] < 1 || b[0] > 4) throw new Error('Unsupported format version ' + b[0] + '.');
  if (sum !== b[b.length - 1]) throw new Error('Checksum failed: the scan was damaged. Scan again.');
  let o = 0;
  const u8 = () => b[o++], u16 = () => { const v = b[o] | (b[o + 1] << 8); o += 2; return v; };
  const ma = v => v === 255 ? null : v / 10;
  const d = { panel: decodeURIComponent(m[1]), scanned: m[4] ? new Date(Number(m[4]) * 1000) : null };
  d.v = u8();
  d.kind = d.v >= 4 ? u8() : 0;                    // 0 = everything in one code (v1-v3)
  const f = u8();
  d.alarm = !!(f & 1); d.silenced = !!(f & 2); d.comms = !!(f & 4); d.powerup = !!(f & 8); d.lim = LIM_TYPES[f >> 4] || LIM_TYPES[0];
  d.now = ma(u8()); d.trip = u8() || null; if (d.trip) d.trip /= 10;
  d.events = []; d.fails = [];
  if (d.kind === 2) {
    // Only what the LIM reports: detail bit 0 = pass/fail graded, bit 1 = Series D cal block
    d.selftests7 = u8(); d.stJumps7 = u8();
    const detail = u8();
    d.graded = !!(detail & 1); d.cal = null; d.dailyRatio = null; d.dailyFails = null; d.stFail7 = 0; d.lastErr = 0;
    if (d.graded) {
      d.stFail7 = u8();
      const nf = u8(); d.fails = Array.from({ length: nf }, () => u16());
      d.lastErr = u8();
      d.dailyFails = []; for (let i = 0; i < 15; i++) { const x = u8(); d.dailyFails.push(x & 15, x >> 4); }
    }
    if (detail & 2) {
      readCal();
      d.dailyRatio = Array.from({ length: 30 }, () => { const x = u8(); return x === 255 ? null : 0.85 + x / 1000; });
    }
    readHealth();
    d.recent = [];
    if (detail & 4) { const n = u8(); for (let i = 0; i < n; i++) { const sec = u16(), type = u8(), val = u8(); d.recent.push({ sec, type, val }); } }
    d.commsErr = u16(); d.uptimeH = u16();
    return flags();
  }
  d.max24 = { ma: ma(u8()), ago: u16() };
  d.max7 = { ma: ma(u8()), ago: u16() };
  d.alarms7 = u8();
  const n = u8();
  for (let i = 0; i < n; i++) { const ago = u16(), dur = u8(); d.events.push({ ago, dur }); }
  d.hourly = Array.from({ length: 24 }, () => ma(u8()));
  d.daily = Array.from({ length: 30 }, () => ma(u8()));
  if (d.v >= 2) {
    d.spread = [];
    for (let i = 0; i < 12; i++) { const x = u8(); d.spread.push((x & 15) / 10, (x >> 4) / 10); }
    d.quiet = { ma: ma(u8()), hAgo: u8() };
    d.steps24 = u8(); d.steps7 = u8(); d.spikes24 = u8(); d.spikes7 = u8(); d.selftests7 = u8(); d.stJumps7 = u8();
  }
  d.commsErr = u16(); d.uptimeH = u16();
  if (d.v === 3) {
    d.stFail7 = u8();
    const nf = u8(); d.fails = Array.from({ length: nf }, () => u16());
    d.lastErr = u8(); readCal(); readHealth();
  }
  return flags();
  function readCal() {
    const ratio = u16(), ratioMin = u16(), off = u16(), offMax = u16(), bad = u8();
    d.cal = ratio === 0xFFFF ? null : { ratio: ratio / 1000, ratioMin: ratioMin / 1000, offset: off > 32767 ? off - 65536 : off, offsetMax: offMax, bad };
  }
  function readHealth() {
    const h = u8();
    d.health = { flash: !!(h & 1), supply: !!(h & 2), busErr: !!(h & 4), wdt: (h >> 3) & 7, keys: !!(h & 64) };
  }
  function flags() {
    if (d.graded === undefined) d.graded = d.v === 3;
    d.hasTrend = d.kind !== 2;                     // THC charts + alarm list
    d.hasSwing = d.v >= 2 && d.kind !== 2;         // steps / spikes
    d.hasTests = d.v === 3 || d.kind === 2;        // graded self-tests + remote health
    return d;
  }
}

// Self-test grading limits, Series D cal block (same rules as the bench tool cal_parse.py)
const RATIO_MIN = 0.97, OFFSET_MAX = 60;
const SD_ERR = { 90: 'line ratio high', 91: 'line ratio low', 92: 'low line', 95: 'L1L3 ratio high', 96: 'L1L3 ratio low', 97: 'frequency out of tolerance' };

// Test record events (the remote's last few hours, seconds ago)
const EV = { 1: e => `LIM alarm received (${(e.val / 10).toFixed(1)} mA): HAZARD LED + buzzer on`, 2: () => 'LIM alarm cleared', 3: () => 'Silenced at this remote',
  4: () => 'TEST pressed here: remote self-test, test sent to the LIM', 5: () => 'TEST pressed here: remote self-test (LIM not asked)',
  6: () => 'LIM self-test started', 7: () => 'LIM self-test passed', 8: () => 'LIM self-test FAILED', 9: () => 'No data from the LIM: remote alarmed', 10: () => 'LIM data back' };
const hms = t => t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });

const at = (scan, ago) => new Date(scan.getTime() - ago * 60000);
const hm = t => t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const day = t => t.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
const hr12 = h => (h % 12 || 12) + (h < 12 ? ' am' : ' pm');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function bars(vals, labels, trip, opts) {
  // vals: oldest first. Bars go amber at >= 80% of trip, red at >= trip. opts.mins: each bar's low mark.
  const W = 640, H = 170, L = 30, R = 16, B = 22, T = 8, n = vals.length;
  const top = Math.max(trip || 0, ...vals.filter(v => v !== null)) * 1.15 || 1;
  const y = v => T + (H - T - B) * (1 - v / top), bw = (W - L - R) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria)}">`;
  for (let g = 0; g <= top; g += top > 8 ? 2 : 1) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="${css('--line')}"/><text x="${L - 4}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  vals.forEach((v, i) => {
    if (v === null) return;
    const c = trip && v >= trip ? css('--bar-alarm') : trip && v >= 0.8 * trip ? css('--bar-hi') : css('--bar');
    const lo = opts.mins ? opts.mins[i] : null;
    s += `<rect x="${L + i * bw + 1}" y="${y(v)}" width="${Math.max(1, bw - 2)}" height="${H - B - y(v)}" rx="1.5" fill="${c}"><title>${esc(labels[i].full)}: ${lo !== null ? `${lo.toFixed(1)} to ` : ''}${opts.fmt ? opts.fmt(v) : v.toFixed(1) + ' mA'}</title></rect>`;
    if (lo !== null && v - lo >= 0.2) s += `<line x1="${L + i * bw + 2}" x2="${L + (i + 1) * bw - 2}" y1="${y(lo)}" y2="${y(lo)}" stroke="${css('--ink')}" stroke-width="2" opacity=".55"/>`;
    if (opts.marks && opts.marks.has(i)) s += `<path d="M${L + i * bw + bw / 2 - 5},${T + 1} h10 l-5,8 z" fill="${css('--red')}"><title>${esc(labels[i].full)}: failed LIM self-test</title></path>`;
    if (labels[i].tick) s += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(labels[i].tick)}</text>`;
  });
  if (trip) s += `<line x1="${L}" x2="${W - R}" y1="${y(trip)}" y2="${y(trip)}" stroke="${css('--red')}" stroke-dasharray="4 3"/><text x="${L + 4}" y="${y(trip) - 4}" text-anchor="start" style="fill:${css('--red')};paint-order:stroke;stroke:${css('--card')};stroke-width:4px;font-weight:600">${esc(opts.tripLabel || `LIM trip ${trip.toFixed(1)} mA`)}</text>`;
  return s + '</svg>';
}

// What the log points to. Wording says "looks like" / "suspect", never "proves".
function findings(d, scan, ev) {
  const out = [];
  let lim = false, room = false;
  if (d.hasTests && (d.stFail7 > 0 || d.lastErr)) {
    lim = true;
    const last = d.fails.length ? at(scan, d.fails[0]) : null;
    const why = [];
    if (d.cal && d.cal.ratioMin < RATIO_MIN) why.push(`L1:L2 ratio down to ${d.cal.ratioMin.toFixed(3)} (healthy about 1.00; fails below ${RATIO_MIN})`);
    if (d.cal && d.cal.offsetMax > OFFSET_MAX) why.push(`offset up to ${d.cal.offsetMax} mV (fails over ${OFFSET_MAX})`);
    if (d.cal && d.cal.bad) why.push(`the LIM's own Bad Tests count is ${d.cal.bad}`);
    if (d.lastErr) why.push(`last LIM error #${d.lastErr}${SD_ERR[d.lastErr] ? ' (' + SD_ERR[d.lastErr] + ')' : ''}`);
    out.push(`<b>${d.stFail7} of ${d.selftests7} LIM self-tests failed this week</b>${last ? `, the newest ${day(last)} ${hm(last)}` : ''}${why.length ? ': ' + why.join('; ') : ''}. The LIM is failing its own check. That is what a bench soak looks for: send it in.`);
  }
  if (d.hasSwing || d.kind === 2) {
    const frac = d.selftests7 ? d.stJumps7 / d.selftests7 : 0;
    if (d.stJumps7 >= 3 && frac >= 0.15) { lim = true; out.push(`<b>Jumps at ${d.stJumps7} of ${d.selftests7} LIM self-tests this week.</b> The reading moves when the LIM tests itself, not when the room changes: suspect the LIM.`); }
    if (d.hasSwing && d.spikes7 >= 10) { lim = true; out.push(`<b>${plural(d.spikes7, 'one-reading spike')} this week</b> (${d.spikes24} in 24 h): the reading jumps and comes straight back. Suspect the LIM or its connections.`); }
  }
  if (ev.length) {
    const hrs = ev.map(e => e.t.getHours() + e.t.getMinutes() / 60);
    const lo = Math.floor(Math.min(...hrs)), hi = Math.ceil(Math.max(...hrs));
    const wk = ev.every(e => e.t.getDay() >= 1 && e.t.getDay() <= 5);
    const short = ev.every(e => e.dur <= 2);
    if (hi - lo <= 4 && ev.length >= 2) { room = true; out.push(`<b>${plural(d.alarms7, 'alarm')} in 7 days, all between ${hr12(lo)} and ${hr12(hi % 24)}${wk ? ', weekdays only' : ''}.</b> A repeating time points to equipment used on a schedule (a case, a cart, a light). Check what is plugged in then.`); }
    else if (short) { lim = true; out.push(`<b>${plural(d.alarms7, 'alarm')}, each lasting a minute or two, at scattered times.</b> Short alarms with no pattern are typical of a LIM glitch rather than a load.`); }
    else out.push(`<b>${plural(d.alarms7, 'alarm')} in 7 days,</b> no single time of day stands out.`);
  }
  if (d.hasSwing && (d.steps24 >= 4 || d.steps7 >= 15) && !lim) {
    room = true;
    out.push(`<b>${plural(d.steps24, 'step')} in 24 h (${d.steps7} this week), none at self-tests.</b> The reading rises, holds for a while, then drops: looks like equipment switching on and off (a battery charger, thermostat or battery check). Check what stays plugged in.`);
  }
  if (d.hasTests && d.health && !(d.health.flash && d.health.supply && d.health.keys) ) out.push(`<b>The remote itself reports a problem</b> (see Remote below). Fix the remote before trusting the log.`);
  if ((d.hasSwing || d.kind === 2) && !lim) out.push(`LIM self-tests look clean: ${d.hasTests && d.graded ? `${d.stFail7} failed, ` : ''}${d.stJumps7} of ${d.selftests7} with a jump.`);
  if (d.kind === 2 && !d.graded) out.push(`This LIM only reports that a self-test ran, not whether it passed. The remote still checks whether the reading jumps at each test.`);
  const head = lim ? ['Suspect the LIM', css('--red')] : room ? ['Looks like the room, not the LIM', css('--amber')]
    : d.kind === 2 ? [d.graded ? 'LIM passes its self-tests' : 'Nothing stands out at self-tests', css('--ok')] : ['Nothing stands out', css('--ok')];
  $('insight').style.borderLeftColor = head[1];
  return `<div class="verdict" style="color:${head[1]}">${head[0]}</div><ul>${out.map(x => `<li>${x}</li>`).join('') || `<li>${d.kind === 2 ? 'No failed self-tests and no LIM errors.' : 'No alarms, steps or spikes in 7 days.'}</li>`}</ul>`;
}

function render(d, scan, sampleKey) {
  $('title').textContent = 'Panel ' + d.panel;
  $('kind').textContent = d.kind === 1 ? 'THC trend report' : d.kind === 2 ? 'LIM health report' : 'LIM remote log';
  $('banner').innerHTML = sampleKey ? `<div class="banner">Sample data (made-up ${esc(d.lim)} panel), times as if scanned ${day(scan)} at ${hm(scan)}. Samples: ${Object.entries(SAMPLES).map(([k, s]) => k === sampleKey ? `<b>${esc(s.label)}</b>` : `<a href="?sample=${k}">${esc(s.label)}</a>`).join(' · ')}</div>` : '';
  const st = d.alarm ? ['ALARM', css('--red')] : d.now !== null && d.trip && d.now >= 0.8 * d.trip ? ['RISING', css('--amber')] : ['NORMAL', css('--ok')];
  const card = ([l, v, s]) => `<div class="card stat"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const mA = v => v === null ? '–' : v.toFixed(1) + ' <small>mA</small>';
  const m24 = d.hasTrend ? at(scan, d.max24.ago) : null, m7 = d.hasTrend ? at(scan, d.max7.ago) : null;
  const lastFail = d.fails.length ? at(scan, d.fails[0]) : null;
  $('stats').innerHTML = (d.kind === 2 ? [
    ['THC now', mA(d.now), `<span class="state" style="background:${st[1]}">${st[0]}</span>${d.silenced ? ' silenced' : ''}`],
    ['Self-tests, 7 days', d.selftests7, 'run by the LIM'],
    ...(d.graded ? [
      ['Failed', d.stFail7 ? `<span style="color:${css('--red')}">${d.stFail7}</span>` : 0, 'last 7 days'],
      ['Last failure', lastFail ? `${hm(lastFail)}` : 'none', lastFail ? day(lastFail) : 'in the last 30 days'],
    ] : [
      ['Jumps at self-tests', d.stJumps7, 'last 7 days'],
      ['Pass / fail', '–', 'this LIM only reports that a test ran'],
    ]),
  ] : [
    ['THC now', mA(d.now), `<span class="state" style="background:${st[1]}">${st[0]}</span>${d.silenced ? ' silenced' : ''}`],
    ['24 h max', mA(d.max24.ma), `${day(m24)} ${hm(m24)}`],
    ['7 day max', mA(d.max7.ma), `${day(m7)} ${hm(m7)}`],
    ['Alarms, 7 days', d.alarms7, d.trip ? `trip ${d.trip.toFixed(1)} mA` : ''],
  ]).map(card).join('');

  const ev = d.events.map(e => ({ t: at(scan, e.ago), dur: e.dur }));
  $('insight').innerHTML = findings(d, scan, ev);

  if (d.hasSwing) {
    const qt = at(scan, d.quiet.hAgo * 60);
    $('stab').innerHTML = [
      ['Steadiest hour moved', mA(d.quiet.ma), `${hr12(qt.getHours())}, ${day(qt)}`],
      ['Steps, 24 h / 7 d', `${d.steps24} <small>/ ${d.steps7}</small>`, 'rise and hold: equipment'],
      ['Spikes, 24 h / 7 d', `${d.spikes24} <small>/ ${d.spikes7}</small>`, 'jump and back'],
      ['Self-test jumps', `${d.stJumps7} <small>of ${d.selftests7}</small>`, 'last 7 days'],
    ].map(card).join('');
    $('stabWrap').hidden = false;
  } else $('stabWrap').hidden = true;

  if (d.hasTests) {
    const h = d.health, probs = [];
    if (!h.flash) probs.push('log memory'); if (!h.supply) probs.push('supply'); if (!h.keys) probs.push('a key stuck');
    if (h.busErr) probs.push('bus errors high'); if (h.wdt) probs.push(plural(h.wdt, 'restart'));
    const c = d.cal, flag = (bad, txt) => bad ? `<span style="color:${css('--red')}">${txt}</span>` : txt;
    $('tests').innerHTML = [
      ...(d.kind === 2 || !d.graded ? [] : [['Self-tests failed', flag(d.stFail7, `${d.stFail7} <small>of ${d.selftests7}</small>`), 'last 7 days']]),
      ...(c ? [
        ['L1:L2 ratio', flag(c.ratioMin < RATIO_MIN, c.ratioMin.toFixed(3)), `lowest this week; last ${c.ratio.toFixed(3)} (healthy ~1.00)`],
        ['Offset', flag(c.offsetMax > OFFSET_MAX, `${c.offsetMax} <small>mV</small>`), `highest this week; last ${c.offset} mV`],
        ['Bad Tests count', c.bad, "the LIM's own counter"],
      ] : d.kind === 2 ? [] : [['Test detail', '–', 'no cal values from this LIM']]),
      ['Remote', probs.length ? flag(true, 'Check') : 'OK', probs.length ? probs.join(', ') : 'self-check passed'],
    ].map(card).join('');
    $('testWrap').hidden = false;
  } else $('testWrap').hidden = true;
  const failAt = d.hasTests ? d.fails : [];
  const fail24 = new Set(failAt.filter(a => a < 1440).map(a => 23 - Math.floor(a / 60)));
  const fail30 = new Set(failAt.filter(a => a < 30 * 1440).map(a => 29 - Math.floor(a / 1440)));

  $('evWrap').hidden = !d.hasTrend;
  const dayLab = n => Array.from({ length: n }, (_, i) => {
    const t = at(scan, (n - 1 - i) * 1440); return { full: day(t), tick: i % 5 === 4 ? t.toLocaleDateString([], { month: 'numeric', day: 'numeric' }) : '' };
  });
  const rec = d.recent || [];
  $('recWrap').hidden = !rec.length;
  if (rec.length) {
    const t = e => new Date(scan.getTime() - e.sec * 1000);
    const al = rec.filter(e => e.type === 1).pop();                // oldest alarm in the record
    let sum = '';
    if (al) {
      const sil = rec.find(e => e.type === 3 && e.sec < al.sec), clr = rec.find(e => e.type === 2 && e.sec < al.sec);
      sum = `<p><b>This remote received the LIM alarm at ${hms(t(al))}</b> and sounded its buzzer`
        + (sil ? `, silenced here after ${al.sec - sil.sec} s` : ', not silenced here')
        + (clr ? `; the alarm cleared after ${al.sec - clr.sec} s` : '') + '.</p>';
    } else sum = '<p>No LIM alarm reached this remote in the last 4 hours.</p>';
    $('rec').innerHTML = sum + `<table><tr><th>Time</th><th>Event</th></tr>${rec.map(e => `<tr><td>${hms(t(e))}</td><td>${esc((EV[e.type] || (() => 'event ' + e.type))(e))}</td></tr>`).join('')}</table>`;
  }
  if (!d.hasTrend) {
    const hasRatio = !!d.dailyRatio && d.dailyRatio.some(r => r !== null);
    $('c24h').hidden = $('c24').hidden = !hasRatio;
    if (hasRatio) {
      $('c24h').textContent = 'L1:L2 imbalance, worst self-test each day (%)';
      $('c24').innerHTML = bars(d.dailyRatio.slice().reverse().map(r => r === null ? null : Math.max(0, (1 - r) * 100)), dayLab(30), (1 - RATIO_MIN) * 100,
        { aria: 'Worst L1:L2 imbalance per day, last 30 days', tripLabel: `fails over ${((1 - RATIO_MIN) * 100).toFixed(0)} % (ratio ${RATIO_MIN})`, fmt: v => `ratio ${(1 - v / 100).toFixed(3)}` });
    }
    $('c30h').hidden = $('c30').hidden = !d.dailyFails;
    $('c30h').textContent = 'Failed self-tests per day, last 30 days';
    if (d.dailyFails) $('c30').innerHTML = bars(d.dailyFails.slice().reverse(), dayLab(30), 1, { aria: 'Failed self-tests per day', tripLabel: 'any = fail', fmt: v => plural(v, 'failed test') });
    $('foot').innerHTML = `${esc(d.lim)} · LIM comms ${d.comms ? 'OK' : '<b>LOST</b>'} · ${d.commsErr} comms errors in 7 days · remote powered up ${d.uptimeH >= 65535 ? 'over 7 years' : Math.floor(d.uptimeH / 24) + ' days'} ago`
      + '<br>For the THC trend, press SILENCE on the remote\'s report screen.'
      + '<br>Times use the scanning phone\'s clock at the moment of the scan. The readings never leave this device.';
    return;
  }
  $('c24h').hidden = $('c24').hidden = $('c30h').hidden = $('c30').hidden = false;
  $('c30h').textContent = 'Last 30 days (daily max)';
  const h24 = d.hourly.slice().reverse(), lab24 = h24.map((_, i) => {
    const t = at(scan, (23 - i) * 60); return { full: `${day(t)} ${hr12(t.getHours())}`, tick: i % 3 === 0 ? hr12(t.getHours()) : '' };
  });
  const mins = d.spread ? d.spread.slice().reverse().map((s, i) => h24[i] === null ? null : Math.max(0, h24[i] - s)) : null;
  $('c24h').textContent = mins ? 'Last 24 hours (bar = hourly max, dark mark = hourly low)' : 'Last 24 hours (hourly max)';
  $('c24').innerHTML = bars(h24, lab24, d.trip, { aria: 'Hourly maximum THC, last 24 hours', mins, marks: fail24 });
  const d30 = d.daily.slice().reverse(), lab30 = d30.map((_, i) => {
    const t = at(scan, (29 - i) * 1440); return { full: day(t), tick: i % 5 === 4 ? t.toLocaleDateString([], { month: 'numeric', day: 'numeric' }) : '' };
  });
  $('c30').innerHTML = bars(d30, lab30, d.trip, { aria: 'Daily maximum THC, last 30 days', marks: fail30 });

  $('events').innerHTML = ev.length
    ? `<table><tr><th>Started</th><th>Lasted</th></tr>${ev.map(e => `<tr><td>${day(e.t)} ${hm(e.t)}</td><td>${e.dur >= 255 ? '4 h+' : e.dur + ' min'}</td></tr>`).join('')}</table>`
      + (d.alarms7 > ev.length ? `<p class="foot">Showing the newest ${ev.length} of ${d.alarms7}.</p>` : '')
    : '<p>None.</p>';
  $('foot').innerHTML = `${esc(d.lim)} · LIM comms ${d.comms ? 'OK' : '<b>LOST</b>'} · ${d.commsErr} comms errors in 7 days · remote powered up ${d.uptimeH >= 65535 ? 'over 7 years' : Math.floor(d.uptimeH / 24) + ' days'} ago`
    + (d.powerup ? ' · <b>power cut inside the window: older data missing</b>' : '')
    + (d.kind === 1 ? '<br>For LIM self-tests and the remote\'s own check, press TEST on the remote\'s report screen.' : '')
    + '<br>Times use the scanning phone\'s clock at the moment of the scan. The readings never leave this device.';
}

// The scan time is stamped into the link the first time it opens (#N.<payload>.<unix seconds>), so a
// forwarded, bookmarked or reopened link keeps the times of the original scan instead of the reader's clock.
let shareUrl = '';
function show(link, now, sampleKey) {
  try {
    const d = decode(link), scan = d.scanned || now;
    render(d, scan, sampleKey);
    shareUrl = d.scanned ? link : link.replace(/(#[1-4]\.[A-Za-z0-9_-]+)/, `$1.${Math.floor(scan.getTime() / 1000)}`);
    if (!sampleKey && !d.scanned && link === location.href) history.replaceState(null, '', shareUrl);
    if (d.scanned && !sampleKey) $('banner').innerHTML = `<div class="banner">Scanned ${day(scan)} at ${hm(scan)}.</div>`;
    $('actions').hidden = false;
  } catch (e) { $('banner').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; $('actions').hidden = true; }
}
$('share').onclick = async () => {
  const data = { title: 'LIM log, ' + $('title').textContent, text: 'LIM remote log', url: shareUrl };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(shareUrl); $('share').textContent = 'Link copied'; setTimeout(() => $('share').textContent = 'Share this log', 2000); }
  } catch (e) { /* share sheet closed */ }
};
$('print').onclick = () => window.print();
$('go').onclick = () => show($('paste').value.trim(), new Date(), null);
if (/^#[1-4]\./.test(location.hash)) show(location.href, new Date(), null);
else {
  const want = new URLSearchParams(location.search).get('sample');
  const key = want && SAMPLES[want] ? want : 'room';
  if (SAMPLES[key]) show(SAMPLES[key].link, new Date(SAMPLES[key].scan), key);
}
</script>
</body>
</html>
